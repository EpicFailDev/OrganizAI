<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Preview Tab Bar</title>
<style>
:root {
  --bg-app: #000000;
  --color-primary-glow: rgba(48, 209, 88, 0.12);
  --text-secondary: rgba(235, 235, 245, 0.6);
  --safe-bottom: 0px;
  --transition-fast: 0.18s cubic-bezier(0.25, 0.1, 0.25, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg-app); color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
.ios-app { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.ios-header { padding: 0.75rem 1.25rem; font-size: 1.3rem; font-weight: 800; border-bottom: 0.5px solid rgba(84,84,88,0.65); background: rgba(0,0,0,0.72); }
.ios-content { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; padding-bottom: calc(94px + 1rem); }
.card { background: rgba(28,28,30,0.85); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 16px; height: 120px; }
.card.big { height: 200px; }

/* ===== CURRENT CSS IN index.css (verified live) ===== */
.ios-tab-bar {
  position: fixed;
  bottom: calc(10px + var(--safe-bottom));
  left: 0;
  right: 0;
  z-index: 200;
  display: flex;
  justify-content: center;
  padding: 0 16px;
  pointer-events: none;
}
.ios-tab-bar-inner {
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  width: 100%;
  max-width: 460px;
  height: 62px;
  padding: 0 6px;
  border-radius: 26px;
  background: rgba(34, 37, 36, 0.92);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border: 0.5px solid rgba(255, 255, 255, 0.09);
  box-shadow:
    0 10px 32px rgba(0, 0, 0, 0.55),
    0 2px 8px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  pointer-events: auto;
}
.ios-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  flex: 1;
  height: 100%;
  border: none;
  background: none;
  cursor: pointer;
  padding: 5px 0;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.18s ease;
  position: relative;
  border-radius: 20px;
}
.ios-tab:active { transform: scale(0.88); }
.ios-tab-icon {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 32px;
  border-radius: 16px;
  transition: background var(--transition-fast), box-shadow var(--transition-fast);
}
.ios-tab-icon svg { transition: all var(--transition-fast); }
.ios-tab.active .ios-tab-icon {
  background: #1de982;
  box-shadow: 0 4px 16px rgba(29, 233, 130, 0.35);
}
.ios-tab.active .ios-tab-icon svg { stroke: #ffffff; }
.ios-tab-label {
  font-family: system-ui, sans-serif;
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: color var(--transition-fast);
  color: rgba(235, 235, 245, 0.62);
  line-height: 1;
  white-space: nowrap;
}
.ios-tab.active .ios-tab-label { color: #1de982; font-weight: 700; }
.ios-tab:not(.active) .ios-tab-icon svg { stroke: rgba(235, 235, 245, 0.88); }
.ios-tab-fab {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(145deg, #2df58d 0%, #1de982 100%);
  color: #000;
  border: none;
  cursor: pointer;
  margin-top: -26px;
  flex-shrink: 0;
  position: relative;
  box-shadow:
    0 0 0 4px rgba(0, 0, 0, 0.85),
    0 6px 24px rgba(29, 233, 130, 0.5),
    0 2px 8px rgba(0, 0, 0, 0.4);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow var(--transition-fast);
}
.ios-tab-fab::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 1.5px solid rgba(29, 233, 130, 0.35);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.ios-tab-fab:hover::after { opacity: 1; transform: scale(1); }
.ios-tab-fab:active {
  transform: scale(0.88) rotate(90deg);
  box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.85), 0 3px 10px rgba(29, 233, 130, 0.35);
}
</style>
</head>
<body>
  <div class="ios-app">
    <header class="ios-header">Início</header>
    <main class="ios-content">
      <div class="card big"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </main>

    <nav class="ios-tab-bar">
      <div class="ios-tab-bar-inner">
        <button class="ios-tab active">
          <div class="ios-tab-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <span class="ios-tab-label">Início</span>
        </button>
        <button class="ios-tab">
          <div class="ios-tab-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
          </div>
          <span class="ios-tab-label">Extrato</span>
        </button>
        <button class="ios-tab-fab" aria-label="Nova transação">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
        <button class="ios-tab">
          <div class="ios-tab-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
          </div>
          <span class="ios-tab-label">Relatórios</span>
        </button>
        <button class="ios-tab">
          <div class="ios-tab-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </div>
          <span class="ios-tab-label">Metas</span>
        </button>
        <button class="ios-tab">
          <div class="ios-tab-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <span class="ios-tab-label">Perfil</span>
        </button>
      </div>
    </nav>
  </div>
</body>
</html>
